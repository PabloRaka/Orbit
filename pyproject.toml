[project]
name = "orbit-physlm"
version = "0.1.0"
description = "Project Resonon: Native Physics-Based Language Model Architecture and Numerical Simulation"
readme = "docs/README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Pablo Raka", email = "pabloraka@users.noreply.github.com" }
]
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
simulation = [
    "jax>=0.4.30",
    "diffrax>=0.6.0",
]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
